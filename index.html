<script>
const SHEET_AHLI_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-RK3Xy6UDixtvV5ys_HkyGm9uVKidkOtDIXTYH8tjKmCW1eZDvr8CHnvsY60gYhxZTc6t10rJodR4/pub?gid=512720693&single=true&output=csv";
const CACHE_KEY_AHLI = "kmt_msas_ahli_sheet_v1";

function pecahBarisCSV(teks) {
  const baris = [];
  let semasa = "";
  let dalamPetikan = false;
  let lajur = [];

  for (let i = 0; i < teks.length; i++) {
    const aksara = teks[i];
    const aksaraSeterusnya = teks[i + 1];

    if (aksara === '"' && dalamPetikan && aksaraSeterusnya === '"') {
      semasa += '"';
      i++;
    } else if (aksara === '"') {
      dalamPetikan = !dalamPetikan;
    } else if (aksara === "," && !dalamPetikan) {
      lajur.push(semasa.trim());
      semasa = "";
    } else if ((aksara === "\n" || aksara === "\r") && !dalamPetikan) {
      if (aksara === "\r" && aksaraSeterusnya === "\n") i++;
      lajur.push(semasa.trim());
      if (lajur.some((v) => v !== "")) baris.push(lajur);
      lajur = [];
      semasa = "";
    } else {
      semasa += aksara;
    }
  }
  if (semasa !== "" || lajur.length > 0) {
    lajur.push(semasa.trim());
    if (lajur.some((v) => v !== "")) baris.push(lajur);
  }
  return baris;
}

function cariIndeksLajur(header, kataKunciList) {
  for (const kunci of kataKunciList) {
    const idx = header.findIndex((h) => h.includes(kunci));
    if (idx >= 0) return idx;
  }
  return -1;
}

async function segerakAhliDariGoogleSheet(paksa = false) {
  if (!paksa) {
    const tersimpan = localStorage.getItem(CACHE_KEY_AHLI);
    if (tersimpan) {
      try {
        const dataCache = JSON.parse(tersimpan);
        if (Array.isArray(dataCache.ahli) && dataCache.ahli.length > 0) {
          kemaskiniSenaraiAhliAplikasi(dataCache.ahli);
        }
      } catch (e) {}
    }
  }

  try {
    const pemisah = SHEET_AHLI_CSV_URL.includes("?") ? "&" : "?";
    const urlTanpaCache = `${SHEET_AHLI_CSV_URL}${pemisah}_=${Date.now()}`;
    const respon = await fetch(urlTanpaCache);
    if (!respon.ok) throw new Error("Gagal memuat turun CSV Google Sheet");

    const teksCSV = await respon.text();
    const semuaBaris = pecahBarisCSV(teksCSV);

    // Cari baris pengepala yang mempunyai nama ahli / no keahlian
    const indeksHeader = semuaBaris.findIndex((r) =>
      r.some((sel) => {
        const s = sel.toLowerCase();
        return s.includes("nama penuh") || s === "nama" || s.includes("no. keahlian") || s.includes("no. ahli");
      })
    );
    if (indeksHeader === -1) return;

    const header = semuaBaris[indeksHeader].map((h) => h.toLowerCase().trim());
    const idxId = cariIndeksLajur(header, ["id permohonan", "id ahli", "id"]);
    const idxNama = cariIndeksLajur(header, ["nama penuh", "nama ahli", "nama"]);
    const idxNoAhli = cariIndeksLajur(header, ["no. keahlian", "no. ahli", "no ahli", "no keahlian"]);
    const idxKeputusan = cariIndeksLajur(header, ["keputusan permohonan", "keputusan", "status"]);
    const idxKategori = cariIndeksLajur(header, ["kategori keahlian", "kategori"]);
    const idxTelefon = cariIndeksLajur(header, ["no. telefon bimbit", "telefon", "whatsapp", "no. tel"]);

    const senaraiAhli = semuaBaris
      .slice(indeksHeader + 1)
      .map((r) => {
        const nama = idxNama >= 0 ? r[idxNama] || "" : "";
        const noAhli =
          (idxNoAhli >= 0 ? r[idxNoAhli] || "" : "") ||
          (idxId >= 0 ? r[idxId] || "" : "");
        const keputusan = idxKeputusan >= 0 ? r[idxKeputusan] || "" : "";

        return {
          idPermohonan: idxId >= 0 ? r[idxId] || "" : "",
          nama,
          noAhli,
          keputusan,
          kategori: idxKategori >= 0 ? r[idxKategori] || "" : "",
          telefon: idxTelefon >= 0 ? r[idxTelefon] || "" : ""
        };
      })
      .filter(
        (ahli) =>
          ahli.nama !== "" &&
          (!ahli.keputusan ||
            ahli.keputusan.toLowerCase() === "diluluskan" ||
            ahli.keputusan.toLowerCase() === "aktif" ||
            ahli.keputusan.toLowerCase() === "lulus")
      );

    localStorage.setItem(
      CACHE_KEY_AHLI,
      JSON.stringify({ masaKemaskini: new Date().toISOString(), ahli: senaraiAhli })
    );
    kemaskiniSenaraiAhliAplikasi(senaraiAhli);
  } catch (err) {
    console.warn("Gagal menyegerak dari Google Sheet (menggunakan data cache jika ada):", err);
  }
}

function kemaskiniSenaraiAhliAplikasi(senaraiAhli) {
  window.DATA_AHLI_KMT = senaraiAhli;
  if (typeof renderSemuaPaparan === "function") {
    renderSemuaPaparan();
  }
  console.log("Senarai ahli terkini dari Google Sheet:", senaraiAhli.length, senaraiAhli);
}

window.addEventListener("DOMContentLoaded", () => {
  segerakAhliDariGoogleSheet(false);
});
</script>
