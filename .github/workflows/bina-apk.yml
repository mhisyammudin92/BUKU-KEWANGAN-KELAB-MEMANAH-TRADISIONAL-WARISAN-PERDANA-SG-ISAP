name: Bina APK Buku Kewangan KMT MSAS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bina-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Muat turun fail repositori
        uses: actions/checkout@v4

      - name: Sediakan Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Sediakan folder web Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          cat << 'EOF' > package.json
          {
            "name": "buku-kewangan-kmt-msas",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            }
          }
          EOF
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "my.kmtwp.bukukewangan",
            "appName": "Buku Kewangan KMT MSAS",
            "webDir": "www"
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: Guna logo kelab sebagai ikon APK Android
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp www/icon-512.png "$dir/ic_launcher.png"
              cp www/icon-512.png "$dir/ic_launcher_round.png"
              cp www/icon-512.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Jana fail APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Muat naik APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buku-Kewangan-KMT-MSAS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
